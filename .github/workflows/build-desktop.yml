name: Build desktop release

on:
  workflow_dispatch:
  push:
    branches:
      - Sawaab_Connecetor

permissions:
  contents: read

env:
  IERASE_VERSION: "1.1.0"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download and test u2net
        run: >-
          python -c "from PIL import Image; from image_processing_sawaab import
          remove_background_ai; result = remove_background_ai(Image.new('RGBA',
          (64, 64), 'white'), model='u2net'); assert result.size == (64, 64)"

      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --distpath release iErase.spec

      - name: Test packaged Windows AI
        shell: pwsh
        run: |
          $test = Start-Process -FilePath .\release\iErase\iErase.exe `
            -ArgumentList "--ai-smoke-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            Get-Content "$env:TEMP\ierase-ai-smoke-test.txt" -ErrorAction SilentlyContinue
            throw "Packaged AI smoke test failed with exit code $($test.ExitCode)."
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: >-
          Compress-Archive -LiteralPath .\release\iErase -DestinationPath
          ".\iErase-v${env:IERASE_VERSION}-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: iErase-Windows-x64
          path: iErase-v${{ env.IERASE_VERSION }}-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download and test u2net
        run: >-
          python -c "from PIL import Image; from image_processing_sawaab import
          remove_background_ai; result = remove_background_ai(Image.new('RGBA',
          (64, 64), 'white'), model='u2net'); assert result.size == (64, 64)"

      - name: Build macOS app
        run: python -m PyInstaller --noconfirm --clean --distpath release iErase.spec

      - name: Ad-hoc sign macOS app
        run: codesign --force --deep --sign - release/iErase.app

      - name: Test packaged macOS AI
        run: release/iErase.app/Contents/MacOS/iErase --ai-smoke-test

      - name: Verify macOS bundle
        run: |
          test -f release/iErase.app/Contents/Info.plist
          test -f release/iErase.app/Contents/Resources/models/u2net/u2net.onnx
          codesign --verify --deep --strict release/iErase.app
          file release/iErase.app/Contents/MacOS/iErase | grep -q arm64

      - name: Create macOS ZIP
        run: >-
          ditto -c -k --sequesterRsrc --keepParent release/iErase.app
          "iErase-v${IERASE_VERSION}-macOS-Apple-Silicon.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: iErase-macOS-Apple-Silicon
          path: iErase-v${{ env.IERASE_VERSION }}-macOS-Apple-Silicon.zip
          if-no-files-found: error
          compression-level: 0
